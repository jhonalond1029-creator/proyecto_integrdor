<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Registro</title>

    <link rel="stylesheet" href="css/registro.css">

</head>

<body>

    <header class="header">
        <a href="/index.html" class="logo" aria-label="Inicio">
            <svg viewBox="0 0 48 48" width="48" height="48" aria-hidden="true">
                <circle cx="24" cy="24" r="24" fill="#10234f" />
                <path d="M24 9 11 15l13 6 13-6-13-6Z" fill="#fff" />
                <path d="M16 19v4c0 2 3.6 4 8 4s8-2 8-4v-4l-8 3.7L16 19Z" fill="#fff" />
                <path d="M17 31v5a3 3 0 0 0 3 3h8a3 3 0 0 0 3-3v-5" fill="none" stroke="#fff" stroke-width="2.5" />
            </svg>
        </a>

        <nav class="nav" aria-label="Navegación principal">
            <a href="/index.html">Inicio</a>
            <a href="nosotros.html">Nosotros</a>
            <a href="#formulario" class="activo" aria-current="page">Matricúlate</a>
            <a href="escuelas.html">Escuelas</a>
        </nav>

        <a href="/login.html" class="btn-login">Iniciar Sesión</a>
    </header>

    <section class="tarjeta">
        <h2>Inscripción</h2>

        <form id="form-registro" novalidate>
            <label for="nombre">Nombre completo</label>
            <input type="text" id="nombre" name="nombre" placeholder="Ingrese el nombre" required />
            

            <label for="correo">Correo electrónico</label>
            <input type="email" id="correo" name="correo" placeholder="Ingrese su dirección de correo" required />

            <label for="telefono">Teléfono</label>
            <input type="tel" id="telefono" name="telefono" placeholder="Número telefónico" required />
            

            <label for="usuario">Usuario</label>
            <input type="text" id="usuario" name="usuario" placeholder="Ingrese el usuario" required />
           

            <label for="password">Contraseña</label>
            <input type="password" id="password" name="password" placeholder="Mínimo 6 caracteres" required />
          
            <div class="botones">
                <button type="submit" class="btn btn-primario">Registrar</button>
                <button type="button" class="btn btn-secundario" id="btn-cancelar">Limpiar</button>
            </div>
        </form>

    </section>

</body>

</html>
